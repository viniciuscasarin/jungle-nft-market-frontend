<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jungle NFT Marketplace - Descoberta, compra e gestão de NFTs com simulação completa." />
    <meta name="theme-color" content="#121212" />
    <meta property="og:title" content="Jungle NFT Market" />
    <meta property="og:description" content="Jungle NFT Marketplace - Descoberta, compra e gestão de NFTs com simulação completa." />
    <meta property="og:type" content="website" />
    <title>Jungle NFT Market</title>
    <link
      rel="preload"
      href="/fonts/roboto-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/roboto-mono-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/roboto-mono-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (function() {
        var g = typeof globalThis !== 'undefined' ? globalThis : window;
        g.__FEDERATION__ = g.__FEDERATION__ || {};
        g.__FEDERATION__.__GLOBAL_PLUGIN__ = g.__FEDERATION__.__GLOBAL_PLUGIN__ || [];
        g.__FEDERATION__.__GLOBAL_PLUGIN__.push({
          name: 'mf-retry-plugin',
          loadEntryError: async function(args) {
            var remoteInfo = args.remoteInfo;
            if (!remoteInfo || !remoteInfo.entry) return undefined;
            var sep = remoteInfo.entry.indexOf('?') >= 0 ? '&' : '?';
            var retryEntry = remoteInfo.entry + sep + 'mf_retry=' + Date.now();
            return await args.getRemoteEntry({
              origin: args.origin,
              remoteInfo: Object.assign({}, remoteInfo, { entry: retryEntry })
            });
          }
        });
      })();
    </script>
  </head>
  <body class="min-h-screen bg-ink text-text-primary font-mono antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
