schema: spec-driven

context: |
  Project: Jungle NFT Marketplace Frontend (React, TypeScript, Nx monorepo, Module Federation).
  Backend: 100% simulated via MSW and Socket.IO (@mswjs/socket.io-binding).
  Currency rule: ETH is strictly decimal string via shared/money; never use number or native arithmetic.
  Architecture: Follow strictly AGENTS.md, ARCHITECTURE.md, and openspec/project.md.


